[project]
name = "argos-ids"
version = "0.1.0"
description = "Argos NetSec IDS reader (Suricata eve.json) + detectors"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
scapy = ["scapy>=2.5"]

[project.scripts]
argos-ids = "argos_ids.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
