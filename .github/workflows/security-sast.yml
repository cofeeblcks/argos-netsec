name: Security SAST

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bandit:
    name: Bandit (scanner + ids)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r scanner/src ids/src -ll -f txt
